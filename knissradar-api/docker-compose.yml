version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: knissradar-postgres
    environment:
      POSTGRES_DB: knissradar
      POSTGRES_USER: knissradar
      POSTGRES_PASSWORD: knissradar_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knissradar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: knissradar-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
